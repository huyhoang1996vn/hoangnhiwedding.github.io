<!DOCTYPE html>
<html lang="en" class="light" translate="no" style="color-scheme: light only">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/icon.PNG">
  <link rel="apple-touch-icon" href="../assets/images/icon.PNG">
  <link rel="stylesheet" href="https://use.typekit.net/yyb5qhs.css">
  <link rel="stylesheet" href="https://use.typekit.net/dbv4jbd.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/custom.css">
  <title>Guests | Hoang &amp; Nhi</title>
  <meta name="google" content="notranslate">
</head>
<body>
  <main class="site-shell bg-ivory min-h-screen">
    <section class="section-padding px-6 pb-16 pt-10">
      <div class="mx-auto max-w-xl text-center">
        <img src="../assets/rsvp-envelope-v2.png" alt="" aria-hidden="true" class="mx-auto mb-4 w-[55%] max-w-[240px] select-none pointer-events-none">
        <h1 class="section-heading">Guests</h1>
        <span class="section-rule"></span>
        <p id="guest-summary" class="section-eyebrow">Loading replies</p>
      </div>

      <div id="guest-list" class="guest-table-wrap mx-auto mt-10 max-w-xl" aria-live="polite"></div>

      <p class="mt-10 text-center">
        <a href="../" class="section-eyebrow !tracking-[0.16em]">Back to the invitation</a>
      </p>
    </section>
  </main>

  <script>
    const GUESTS_API_URL = '/rsvps';
    const list = document.getElementById('guest-list');
    const summary = document.getElementById('guest-summary');

    function guestLabel(count) {
      return count === 1 ? '1 guest' : count + ' guests';
    }

    function formatWhen(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('en-GB', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function renderGuests(guests) {
      const people = guests.reduce((sum, guest) => sum + Number(guest.attendees || 0), 0);
      const parties = guests.length;
      summary.textContent = parties === 0
        ? 'No replies yet'
        : parties + (parties === 1 ? ' reply' : ' replies') + ' · ' + guestLabel(people);

      if (!guests.length) {
        list.innerHTML = '<p class="guest-empty">The book is still open.</p>';
        return;
      }

      const table = document.createElement('table');
      table.className = 'guest-table';

      const head = document.createElement('thead');
      const headRow = document.createElement('tr');
      ['Name', 'Guests', 'Stay', 'Message', 'Sent'].forEach((label) => {
        const cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = label;
        headRow.append(cell);
      });
      head.append(headRow);

      const body = document.createElement('tbody');
      guests.forEach((guest) => {
        const row = document.createElement('tr');

        const name = document.createElement('td');
        name.className = 'guest-name';
        name.textContent = guest.fullName;

        const count = document.createElement('td');
        count.className = 'guest-count';
        count.textContent = String(guest.attendees);

        const stay = document.createElement('td');
        stay.className = 'guest-note';
        stay.textContent = guest.stay || '—';

        const note = document.createElement('td');
        note.className = 'guest-note';
        note.textContent = guest.message || '—';

        const when = document.createElement('td');
        when.className = 'guest-when';
        const sent = formatWhen(guest.createdAt);
        if (sent) {
          const [day, time] = sent.split(', ');
          const dayLine = document.createElement('span');
          dayLine.textContent = day || sent;
          const timeLine = document.createElement('span');
          timeLine.textContent = time || '';
          when.append(dayLine, timeLine);
        }

        row.append(name, count, stay, note, when);
        body.append(row);
      });

      table.append(head, body);
      list.replaceChildren(table);
    }

    fetch(GUESTS_API_URL)
      .then((response) => {
        if (!response.ok) throw new Error('Could not load guests');
        return response.json();
      })
      .then(renderGuests)
      .catch(() => {
        summary.textContent = 'Unable to load replies';
        list.innerHTML = '<p class="guest-error">Please check that the guest book is open.</p>';
      });
  </script>
</body>
</html>
